  - key: is_cell_activation_performed
    type: radio-field
    name: is_cell_activation_performed
    description: "Indicates whether cell activation is performed, a process where a ligand binds to its receptors on a cell, enhancing the cell's ability to respond to various stimuli. Answer with \"Yes\" or \"No\" value. Example: Yes"
    prefLabel: Is cell activation performed?
    values:
      - label: "Yes"
      - label: "No"
    configuration:
      required: true
  - key: activation_stimulus
    type: text-field
    name: activation_stimulus
    description: "The specific type of stimulus used to provoke cell activation. This field is required if \"Is cells activation performed?\" is marked as \"Yes\". Example: PMA/ionomycin"
    prefLabel: Activation stimulus
  - key: is_fcr_blocking_applied
    type: radio-field
    name: is_fcr_blocking_applied
    description: "Indicates whether a reagent has been added to the staining procedure to block the binding of antibodies to Fc receptors (FcRs) on cells. This process prevents non-specific binding and ensures that antibodies detect only the intended target antigen, thereby minimizing false positive signals by preventing antibodies from attaching to the cell via their Fc region instead of the antigen-specific binding site. Answer with \"Yes\" or \"No\" value. Example: Yes"
    prefLabel: Is FcR blocking applied?
    values:
      - label: "Yes"
      - label: "No"
    configuration:
      required: true
  - key: is_heparin_used
    type: radio-field
    name: is_heparin_used
    description: "Indicates whether heparin was used during the staining process to prevent non-specific binding of metal-labeled antibodies to eosinophils, thereby reducing background noise. Answer with \"Yes\" or \"No\" value. Example: Yes"
    prefLabel: Is heparin used?
    values:
      - label: "Yes"
      - label: "No"
    configuration:
      required: true
  - key: loaded_cell_concentration_value
    type: numeric-field
    name: loaded_cell_concentration_value
    description: "The number of cells within a given volume of liquid immediately prior to the experiment, essentially indicating how densely packed the cells are in the solution. Example: 500000"
    prefLabel: Loaded cell concentration value
    datatype: xsd:long
  - key: loaded_cell_concentration_unit
    type: controlled-term-field
    name: loaded_cell_concentration_unit
    description: "The unit of measurement for the loaded cell concentration value. If no concentration is provided, this field may be left blank. Example: cells/mL"
    prefLabel: Loaded cell concentration unit
    datatype: iri
    values:
      - type: class
        sourceAcronym: HRAVS
        termIri: https://purl.humanatlas.io/vocab/hravs#HRAVS_0000423
        termType: class
        termLabel: cells/mL
  - key: instrument_calibration_bead_kit
    type: controlled-term-field
    name: instrument_calibration_bead_kit
    description: "The calibration bead kit used with the instrument. These kits contain beads with known mass intensity used to adjust the settings of a flow cytometer to ensure accurate measurements. If custom bead kit was used, enter \"Custom\", otherwise if no bead kit was used, enter \"None\". Example: Standard BioTools; CyTOF Calibration Beads; PN 201073"
