type: template
name: iCLAP
description: "iCLAP (individual-nucleotide resolution UV-crosslinking and affinity purification) is a specialized, high-stringency technique designed to map the specific RNA binding sites of RNA-binding proteins (RBPs) at the single-nucleotide level."
id: https://repo.metadatacenter.org/templates/a90ac004-dc16-44bf-b1a7-87bca55b3a6c
children:
  - key: assay_description
    type: static-rich-text
    name: assay_description
    description: A styled paragraph describing the assay
    prefLabel: Assay Description
    content: |
      <hr />
      <p><span style="color: rgb(31, 35, 40); font-family: -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;; font-size: 16px; background-color: rgb(246, 248, 250);">iCLAP (individual-nucleotide resolution UV-crosslinking and affinity purification) is a specialized, high-stringency technique designed to map the specific RNA binding sites of RNA-binding proteins (RBPs) at the single-nucleotide level.</span></p>

      <hr />
      <p>&nbsp;</p>
  - key: parent_sample_id
    type: text-field
    name: parent_sample_id
    description: "The unique identifier from HuBMAP or SenNet for the sample (such as a block, section, or suspension) used to perform the assay. For instance, in an RNAseq assay, the parent sample would be the suspension, while in imaging assays, it would be the tissue section. If the assay is derived from multiple parent samples, this field should contain a comma-separated list of identifiers. Example: HBM386.ZGKG.235, HBM672.MKPK.442"
    prefLabel: Parent sample ID
    regex: "^(?:HBM|SNT)\\d{3}\\.[A-Z]{4}\\.\\d{3}(?:,\\s*(?:HBM|SNT)\\d{3}\\.[A-Z]{4}\\.\\d{3})*$"
    configuration:
      required: true
  - key: lab_id
    type: text-field
    name: lab_id
    description: An identifier assigned by the data provider to reference an external metadata record for the dataset. The external record may be maintained independently and can support dataset traceability and provenance tracking. Leave this field empty if no such identifier exists.
    prefLabel: Lab ID
  - key: preparation_protocol_doi
    type: link-field
    name: preparation_protocol_doi
    description: "The DOI for the protocols.io page that details the assay or the procedures used for sample procurement and preparation. For example, in the case of an imaging assay, the protocol may start with tissue section staining and end with the generation of an OME-TIFF file. The documented protocol should also include any image processing steps involved in producing the final OME-TIFF. Example: https://dx.doi.org/10.17504/protocols.io.eq2lyno9qvx9/v1"
    prefLabel: Preparation protocol DOI
    configuration:
      required: true
  - key: dataset_type
    type: controlled-term-field
    name: dataset_type
    description: "The specific type of dataset being produced. Example: RNAseq"
    prefLabel: Dataset type
    datatype: iri
