    datatype: xsd:int
    configuration:
      required: true
  - key: non_global_files
    type: text-field
    name: non_global_files
    description: "A semicolon separated list of non-shared files to be included in the dataset. The path assumes the files are located in the \"TOP/non-global/\" directory. For example, for the file is TOP/non-global/lab_processed/images/1-tissue-boundary.geojson the value of this field would be \"./lab_processed/images/1-tissue-boundary.geojson\". After ingest, these files will be copied to the appropriate locations within the respective dataset directory tree."
    prefLabel: Non global files
    regex: "^(?:\\.\\/[^;]+|\\w[^;]+)(?:;\\s*(?:\\.\\/[^;]+|\\w[^;]+))*$"
  - key: tag_enzyme_sequence
    type: radio-field
    name: tag_enzyme_sequence
    description: "The unique two-nucleotide barcode sequence contained within the adapter introduced by the TAG Enzyme during tagmentation. In multiplexed Paired-Tag experiments, different tag enzyme sequences are assigned to different samples or assay conditions to distinguish them and are used to demultiplex the pooled sequencing data."
    prefLabel: Tag enzyme sequence
    values:
      - label: GG
      - label: TT
      - label: AC
      - label: AT
