  - key: number_of_input_cells_or_nuclei
    type: numeric-field
    name: number_of_input_cells_or_nuclei
    description: "The number of cells or nuclei that were input into the assay. This information is typically not available for assays performed on bulk tissue preparations, and therefore this field may be left blank. Example: 1000"
    prefLabel: Number of input cells or nuclei
    datatype: xsd:int
  - key: amount_of_input_analyte_value
    type: numeric-field
    name: amount_of_input_analyte_value
    description: "The amount of RNA or DNA input into the assay, typically measured using instruments such as a Qubit, BioAnalyzer, or TapeStation. In most single-cell or single-nucleus assays, this value is usually not available, and therfore this field may be left blank. Example: 500"
    prefLabel: Amount of input analyte value
    datatype: xsd:decimal
  - key: amount_of_input_analyte_unit
    type: controlled-term-field
    name: amount_of_input_analyte_unit
    description: "The unit of measurement used to specify the amount of input analyte value. If no input amount, this field may be left blank. Example: ng"
    prefLabel: Amount of input analyte unit
    datatype: iri
    values:
      - type: class
        sourceAcronym: HRAVS
        termIri: http://purl.obolibrary.org/obo/UO_0000023
        termType: class
        termLabel: ug
      - type: class
        sourceAcronym: HRAVS
        termIri: http://purl.obolibrary.org/obo/UO_0000024
        termType: class
        termLabel: ng
  - key: library_adapter_sequence
    type: text-field
    name: library_adapter_sequence
    description: "The 5' and/or 3' adapter sequences used during library preparation to make the library compatible with the sequencing protocol and instrumentation. Adapter sequences should be provided as a comma-separated list of key-value pairs in the format: \"adapter name: sequence\". Example: Nextera Read 1: CTGTCTCTTATACACATCT"
