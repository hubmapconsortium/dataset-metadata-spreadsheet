        termType: class
        termLabel: year
  - key: contributors_path
    type: text-field
    name: contributors_path
    description: "The name of the file containing the ORCID IDs for all contributors to this dataset. Example: ./contributors.csv"
    prefLabel: Contributors path
    regex: ^(?:\.\/.*|\w.*)\.tsv$
    configuration:
      required: true
  - key: data_path
    type: text-field
    name: data_path
    description: "The top-level directory containing the raw and/or processed data. For a single dataset upload, this might be represented as \".\", whereas for a data upload containing multiple datasets, this would be the directory name for the respective dataset. For example, if the data is within a directory named \"TEST001-RK\", use the syntax \"./TEST001-RK\" for this field. If there are multiple directory levels, use the format \"./TEST001-RK/Run1/Pass2\", where \"Pass2\" is the subdirectory where the single dataset's data is stored. This is an internal metadata field used solely for data ingestion. Example: ./TEST001-RK"
    prefLabel: Data path
    regex: ^(?:\.|\.\/.+|\w.*)$
    configuration:
      required: true
  - key: barcode_offset
    type: radio-field
    name: barcode_offset
    description: "The position within a sequencing read where a barcode sequence begins. In sequencing libraries, barcodes—short DNA sequences used to tag individual cells or molecules—are often arranged in a pattern where each barcode is separated by a constant sequence of known length. These constant sequences create predictable spacing between barcodes, known as offsets. For example, if barcodes are 8 base pairs (bp) long and separated by 30 bp constant regions, the barcodes might start at positions 0, 38, and 76 within the read. If the source material is not barcoded, this field should be marked as \"Not applicable\". Example: 0,38,76"
    prefLabel: Barcode offset
    values:
      - label: "0"
      - label: "1"
      - label: "8"
      - label: "20"
      - label: "0,14"
      - label: "1,27"
      - label: "0,38,76"
      - label: "10,48,78"
      - label: "10,48,86"
      - label: "0,20-23,51-54"
      - label: Not applicable
    configuration:
      required: true
  - key: barcode_read
    type: controlled-term-field
    name: barcode_read
    description: "The sequencing read file contains the cell or capture spot barcode sequences. This information is essential when constructing sequencing libraries with a non-commercial kit, as it ensures that barcodes are correctly extracted during data processing. If the source material is not barcoded, this field should be marked as \"Not applicable\". Example: Read 1 (R1)"
    prefLabel: Barcode read
    datatype: iri
    values:
      - type: class
        sourceAcronym: HRAVS
        termIri: http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C172301
        termType: class
        termLabel: Read 1 (R1)
      - type: class
        sourceAcronym: HRAVS
        termIri: http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C172302
        termType: class
        termLabel: Read 2 (R2)
      - type: class
        sourceAcronym: HRAVS
        termIri: http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C48660
        termType: class
        termLabel: Not applicable
    configuration:
      required: true
  - key: barcode_size
    type: radio-field
    name: barcode_size
    description: "The length of each cell or capture spot barcode in base pairs (bp). If the source material is not barcoded, enter \"Not applicable\". Example: 16"
    prefLabel: Barcode size
    values:
      - label: "14"
      - label: "16"
      - label: "40"
      - label: "8,6"
      - label: "10,10"
      - label: "8,8,8"
      - label: "14-17,14,14"
      - label: Not applicable
    configuration:
      required: true
  - key: umi_offset
    type: radio-field
    name: umi_offset
    description: "The position within a sequencing read where the Unique Molecular Identifier (UMI) sequence begins. UMIs are short, random nucleotide sequences added to DNA or RNA fragments during library preparation to uniquely tag each original molecule. If no UMI is used, enter \"Not applicable\". Example: 16"
    prefLabel: UMI offset
    values:
      - label: "0"
      - label: "16"
      - label: "36"
      - label: Not applicable
    configuration:
      required: true
  - key: umi_read
    type: controlled-term-field
    name: umi_read
    description: "Specifies which sequencing read file contains the Unique Molecular Identifier (UMI) barcode. If no UMI is used, enter \"Not applicable\". Example: Read 1 (R1)"
    prefLabel: UMI read
    datatype: iri
    values:
      - type: class
        sourceAcronym: HRAVS
        termIri: http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C172301
        termType: class
        termLabel: Read 1 (R1)
      - type: class
        sourceAcronym: HRAVS
        termIri: http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C172302
        termType: class
        termLabel: Read 2 (R2)
      - type: class
        sourceAcronym: HRAVS
        termIri: http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C48660
        termType: class
        termLabel: Not applicable
    configuration:
      required: true
  - key: umi_size
    type: radio-field
    name: umi_size
    description: "The length of the Unique Molecular Identifier (UMI) in base pairs (bp). If no UMI is used, enter \"Not applicable\". Example: 8"
    prefLabel: UMI size
    values:
      - label: "8"
      - label: "9"
      - label: "10"
      - label: "12"
      - label: Not applicable
    configuration:
      required: true
  - key: assay_input_entity
    type: controlled-term-field
    name: assay_input_entity
    description: "The entity from which the analyte is captured. For example, in bulk sequencing, the source entity would be \"tissue\" while in single-cell sequencing, it would be \"single cell\". Example: single cell"
    prefLabel: Assay input entity
