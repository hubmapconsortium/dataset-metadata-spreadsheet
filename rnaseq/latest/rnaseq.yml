    type: numeric-field
    name: number_of_iterations_of_cdna_amplification
    description: "The number of amplification cycles applied to cDNA prior to library construction. This is typically the number of PCR cycles used. For protocols using linear amplification methods (e.g., aRNA), this refers to the number of amplification rounds performed. Example: 3"
