        termType: class
        termLabel: ul
    configuration:
      required: true
  - key: library_output_amount_value
    type: numeric-field
    name: library_output_amount_value
    description: "The total amount of library following the clean-up step after the final PCR amplification. To calculate, multiply the Qubit-measured concentration (ng/µl) by the elution volume (µl) obtained after the final clean-up. Example: 125"
    prefLabel: Library output amount value
    datatype: xsd:decimal
  - key: library_output_amount_unit
